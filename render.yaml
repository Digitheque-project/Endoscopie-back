# Blueprint Render — déploiement du backend NestJS
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: endoscopie-api
    runtime: node
    rootDir: endoscopie-back
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENDOSCOPIE_SERVICE_ID
        value: 38f39d38-152e-495b-8c48-28937750d9eb
      - key: CHU_API_URL
        value: https://service-chu-back-production-77d5.up.railway.app
      - key: NOTIFICATION_API_URL
        value: https://service-notification.onrender.com
      - key: NOTIFICATION_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: endoscopie-bd
          property: connectionString
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /

databases:
  - name: endoscopie-bd
    plan: free
    databaseName: endoscopie_bd
    user: endoscopie_bd_user
