# Blueprint Render — déploiement du backend NestJS
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: endoscopie-api
    runtime: node
    rootDir: endoscopie-back
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENDOSCOPIE_SERVICE_ID
        value: 38f39d38-152e-495b-8c48-28937750d9eb
      - key: ENDOSCOPIE_CHU_ID
        value: 72d49761-2a65-446d-b025-15a74cac1ad4
      - key: CHU_API_URL
        value: https://service-chu-back-production-d6a8.up.railway.app
      - key: ACCUEIL_API_URL
        value: https://acceuil-back-production.up.railway.app
      - key: NOTIFICATION_API_URL
        value: https://service-notification.onrender.com
      - key: NOTIFICATION_WEBHOOK_SECRET
        sync: false
      # URL de l'API Bloc Opératoire (intégration CPA/VPA — à renseigner une fois fournie)
      - key: BLOC_API_URL
        sync: false
      # À renseigner manuellement dans le dashboard Render avec votre URL Supabase
      - key: DATABASE_URL
        sync: false
      # Même URL Supabase (connexion directe port 5432, sans pgbouncer)
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /
